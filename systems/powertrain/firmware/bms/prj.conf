# BMS - Phase 0 configuration.
#
# Console over UART. Zephyr's nucleo_h743zi board definition already selects
# usart3 as `zephyr,console`, the instance wired to the ST-Link virtual COM port
# on real hardware and the instance the harness taps in the emulator.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# CAN. The board's `zephyr,canbus` chosen node is already fdcan1; the overlay
# only sets the bit rate and marks it okay.
CONFIG_CAN=y

# ---------------------------------------------------------------------------
# Determinism.
#
# The exit criterion is a byte-identical sha256 of the console capture across
# runs, so every source of run-varying console text is switched off here rather
# than filtered out afterwards. Filtering hides a real problem; disabling
# removes it.
# ---------------------------------------------------------------------------

# The boot banner is kept. Its text is "*** Booting Zephyr OS build
# zephyr-v3.5.0 ***", which is a constant string baked in at build time from the
# pinned tag, not a timestamp. It is useful evidence that the pinned Zephyr is
# the one that ran, and it is stable across a clean rebuild of the same tree.
CONFIG_BOOT_BANNER=y

# Logging is left off entirely. The log subsystem prefixes messages with an
# uptime timestamp, and although that timestamp is derived from virtual time and
# would in principle be reproducible, it is one more thing that has to stay
# reproducible for the hash to hold. printk goes straight to the console with no
# prefix, so there is nothing to keep stable.
CONFIG_LOG=n

# Timeslicing off: with it on, the scheduler can preempt at a tick boundary and
# reorder work between equal-priority threads. This build has one application
# thread, so it changes nothing today, and it removes a scheduling degree of
# freedom before Phase 1 adds threads that would be affected.
CONFIG_TIMESLICING=n

# Assertions on. This is the same binary shape that later phases test, not a
# special emulator build. The claim of the project is that the binary under test
# is the binary that would ship.
CONFIG_ASSERT=y
